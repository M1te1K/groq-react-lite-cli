[project]
name = "react-lite-cli"
version = "0.1.0"
description = "CLI-агент ReAct-lite с Groq, курсами ЦБ и Decimal-калькулятором"
requires-python = ">=3.12,<3.13"
dependencies = [
  "groq>=0.37,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "tzdata>=2025.2",
]

[project.scripts]
react-lite = "react_lite.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/react_lite"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "ruff>=0.13,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
